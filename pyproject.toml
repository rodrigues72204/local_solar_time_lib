[project]
name = "local-solar-time-lib"
version = "0.1.1"
description = "Computes local mean and apparent solar time from a longitude and a standard meridian, so you can turn a clock reading into the time a sundial would show."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
